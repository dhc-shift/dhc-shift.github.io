project:
  type: website
  output-dir: docs
  resources:
    - "SHIFT 로고.svg"
    - "SHITF_신입_부원_모집_홍보용.pdf"

website:
  title: "SHIFT"
  description: "디지털헬스케어 학술 커뮤니티 SHIFT 모집 블로그"
  site-url: "https://dhc-shift.github.io"
  favicon: "SHIFT 로고.svg"
  search:
    location: navbar
    type: overlay
  page-navigation: true
  page-footer:
    left: "© SHIFT. Digital Healthcare Academic Community."
    right:
      - icon: github
        href: https://github.com/dhc-shift

  navbar:
    logo: "SHIFT 로고.svg"
    title: false
    collapse-below: lg
    left:
      - text: "메인"
        href: index.qmd
      - text: "소개"
        href: about.qmd
      - text: "무엇을 하나요"
        href: what-we-do.qmd
      - text: "커리큘럼"
        href: curriculum.qmd
      - text: "결과"
        href: results.qmd
      - text: "지원 방법"
        href: apply.qmd
    right:
      - icon: github
        href: https://github.com/dhc-shift

format:
  html:
    lang: ko
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    code-link: true
    highlight-style: github-dark

editor: source
freeze: auto
