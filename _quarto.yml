project:
  type: website
  output-dir: docs
  resources:
    - "SHIFT 로고.svg"

website:
  title: "SHIFT"
  description: "디지털헬스케어 학술 커뮤니티 SHIFT"
  site-url: "https://dhc-shift.github.io"
  favicon: "SHIFT 로고.svg"
  search:
    location: navbar
    type: overlay
  page-navigation: true
  page-footer:
    left: "© SHIFT. Digital Healthcare Academic Community."
    right:
      - icon: github
        href: https://github.com/dhc-shift

  navbar:
    logo: "SHIFT 로고.svg"
    title: false
    collapse-below: lg
    left:
      - text: "공지"
        href: notice.qmd
      - text: "소개"
        href: about.qmd
      - text: "활동"
        href: activities.qmd
      - text: "프로젝트"
        menu:
          - text: "프로젝트 홈"
            href: projects/index.qmd
          - text: "IT 온보딩"
            href: projects/it-onboarding.qmd
          - text: "디지털헬스케어 직무 로드맵"
            href: projects/digital-healthcare-roadmap.qmd
      - text: "소모임"
        href: groups.qmd
      - text: "자료실"
        href: resources.qmd
    right:
      - icon: github
        href: https://github.com/dhc-shift

format:
  html:
    lang: ko
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    code-link: true
    highlight-style: github-dark

editor: source
freeze: auto
