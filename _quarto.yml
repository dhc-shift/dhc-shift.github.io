project:
  type: website
  render:
    - "*.qmd"
    - "announcements/**/*.qmd"
    - "activities/**/*.qmd"
    - "events/**/*.qmd"
    - "onboarding/**/*.qmd"

website:
  title: "DHC-SHIFT"
  description: "Digital Healthcare Community, 학과 디지털헬스케어 학술동아리"
  site-url: "https://dhc-shift.github.io"
  favicon: assets/images/favicon.svg
  navbar:
    title: false
    logo: assets/images/logo.svg
    logo-alt: "DHC-SHIFT"
    left:
      - href: index.qmd
        text: 홈
      - href: about.qmd
        text: 소개
      - href: announcements/index.qmd
        text: 공지
      - href: activities/index.qmd
        text: 활동
      - href: onboarding/index.qmd
        text: 온보딩
      - href: members.qmd
        text: 멤버
      - href: gallery.qmd
        text: 갤러리
      - href: events/index.qmd
        text: 일정
      - href: resources.qmd
        text: 자료실
    right:
      - icon: github
        href: https://github.com/dhc-shift
        aria-label: GitHub
  page-footer:
    left: "DHC-SHIFT"
    center: "Digital Healthcare Community"
    right: "© 2026 DHC-SHIFT"
  back-to-top-navigation: true

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
    code-copy: true
    smooth-scroll: true
    anchor-sections: false
    link-external-newwindow: true
