project:
  type: website
  render:
    - "*.qmd"
    - "announcements/**/*.qmd"
    - "activities/**/*.qmd"
    - "events/**/*.qmd"
    - "resources/**/*.qmd"

website:
  title: "DHC-SHIFT"
  description: "학과 기반 디지털헬스케어 학술동아리"
  site-url: "https://dhc-shift.github.io"
  favicon: assets/images/favicon.svg
  navbar:
    title: false
    logo: assets/images/logo.svg
    logo-alt: "DHC-SHIFT"
    left:
      - href: index.qmd
        text: 홈
      - href: about.qmd
        text: 동아리 소개
      - href: announcements/index.qmd
        text: 공지사항
      - href: activities/index.qmd
        text: 활동기록
      - href: members.qmd
        text: 멤버
      - href: gallery.qmd
        text: 갤러리
      - href: events/index.qmd
        text: 일정
      - href: resources.qmd
        text: 자료실
    right:
      - icon: github
        href: https://github.com/dhc-shift
        aria-label: GitHub
  page-footer:
    left: "DHC-SHIFT"
    center: "Digital Healthcare Community"
    right: "© 2026 DHC-SHIFT"
  page-navigation: true
  back-to-top-navigation: true

format:
  html:
    theme:
      light: [flatly, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: false
    smooth-scroll: true
    anchor-sections: true
